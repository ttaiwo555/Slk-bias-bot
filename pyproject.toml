[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "slk-bot"
version = "0.1.0"
description = "SLK Bias Bot – Phase 0 data layer"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "pytz>=2024.1",
    "APScheduler>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["slk_bot*"]

[tool.pytest.ini_options]
testpaths = ["slk_bot/tests"]

