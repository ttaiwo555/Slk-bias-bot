  # ── Commodities ──────────────────────────────────────────────────────────
  - name: USOIL
    asset_class: commodity
    oanda_symbol: WTICO_USD
    alignment: oil
    display_scale: 1
    exclude_from_triggers: true

  - name: XAUUSD
    asset_class: commodity
    oanda_symbol: XAU_USD
    alignment: metal

  - name: XAGUSD
    asset_class: commodity
    oanda_symbol: XAG_USD
