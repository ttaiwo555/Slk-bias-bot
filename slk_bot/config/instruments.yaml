  # ── Crypto ───────────────────────────────────────────────────────────────
  # BTCUSD and ETHUSD use 17:00 NY daily/H4 grid (matching reference bot BTCUSD)
  - name: BTCUSD
    asset_class: crypto
    oanda_symbol: null
    binance_symbol: BTCUSDT
    bybit_symbol: BTCUSDT
    coinbase_symbol: BTC-USD
    alignment: crypto_ny17

  - name: ETHUSD
    asset_class: crypto
    oanda_symbol: null
    binance_symbol: ETHUSDT
    bybit_symbol: ETHUSDT
    coinbase_symbol: ETH-USD
    alignment: crypto_ny17

  # BTCUSDT and ETHUSDT use 00:00 UTC grid (matching reference bot BTCUSDT / ETHUSDT)
  - name: BTCUSDT
    asset_class: crypto
    oanda_symbol: null
    binance_symbol: BTCUSDT
    bybit_symbol: BTCUSDT
    coinbase_symbol: BTC-USDT
    alignment: crypto

  - name: ETHUSDT
    asset_class: crypto
    oanda_symbol: null
    binance_symbol: ETHUSDT
    bybit_symbol: ETHUSDT
    coinbase_symbol: ETH-USDT
    alignment: crypto
