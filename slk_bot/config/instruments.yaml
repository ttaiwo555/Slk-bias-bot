    alignment: us_index

  - name: SPX500
    asset_class: index
    oanda_symbol: SPX500_USD
    alignment: us_index

  - name: GER40
    asset_class: index
    oanda_symbol: DE30_EUR          # OANDA may use DE30; checked at runtime
    alignment: eu_index

  - name: US30
    asset_class: index
