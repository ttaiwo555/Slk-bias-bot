# SLK Bias Bot – Instrument list
# Each entry:
#   name:          internal name used everywhere in the bot
#   asset_class:   forex | index | commodity | crypto
#   oanda_symbol:  symbol as OANDA uses it (null if not on OANDA)
#   binance_symbol: symbol as Binance uses it (null if not crypto)
#   bybit_symbol:  symbol as Bybit uses it (null if not crypto)
#   coinbase_symbol: symbol as Coinbase uses it (null if not crypto)
#   alignment:     session alignment profile (see settings.yaml)

instruments:
  # ── Majors ──────────────────────────────────────────────────────────────
  - name: EURUSD
    asset_class: forex
    oanda_symbol: EUR_USD
    alignment: forex

