strategy:
  trend_alignment: required
  trend_candidate: c
  trend_evaluation_moment: alert_time
  unfresh_policy: false
  unfresh_alerts: false
  lookback_weekly: 104
  lookback_daily: 250
  lookback_h4: 300
  max_disrespects: 3
  ocl_max_disrespects: 1
  age_rules:
    timeframes:
    - D
    max_age_months: 6
    max_age_months_disrespect_3: 4
  doji_body_threshold_pct: 0
  sweep_lookback_candles: 1
  marginal_threshold_pct:
    forex: 0.02
    commodity: 0.03
    index: 0.2
    crypto: 0.15
  expiry_daily_trigger_candles: 3
  expiry_weekly_trigger_candles: 14
  primary_selection_rule: nearest_extreme
  repeat_cooldown_trading_days: 0
push_rules:
  push_methods:
  - 1
  - 2
  - 3
  push_breakout_types:
  - external
  push_htf:
  - W
  - D
  unfresh_alerts: false
  digest_overflow_threshold: 5
price_alerts:
  check_interval_seconds: 60
  expiry_hours: 48
  tolerance_disclaimer: Feed prices can differ from your TradingView chart by up to
    about 0.1% on indices and crypto.
scheduler:
  scan_interval_minutes: 5
  stale_market_hours_warning: true
telegram:
  parse_mode: HTML
  digest_max_per_batch: 5
alert_preferences:
  external_bo: false
  internal_bo: false
  trend_alignment: required
